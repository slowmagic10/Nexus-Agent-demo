<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <title>Nexus Agent</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <header class="brand">
          <div class="mark">N</div>
          <div><strong>Nexus</strong><span>Local agent</span></div>
        </header>

        <button id="new-session" class="new-task"><span>＋</span> 新建任务</button>

        <div class="section-heading">
          <span>最近任务</span>
          <span id="session-count" class="count">0</span>
        </div>
        <nav id="session-list" class="session-list" aria-label="任务列表"></nav>

        <footer class="sidebar-foot">
          <span id="health-dot" class="dot"></span>
          <span id="health-text">正在连接 Gateway</span>
        </footer>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div class="task-heading">
            <div class="title-line">
              <span id="phase-dot" class="phase-dot idle"></span>
              <h1 id="session-title">准备开始</h1>
            </div>
            <div id="session-meta" class="status-line">
              <span class="status-chip">本地执行</span>
              <span class="status-chip">逐次审批</span>
            </div>
          </div>
          <div class="actions">
            <button id="theme-toggle" class="icon-button theme-toggle" aria-label="切换到浅色主题" aria-pressed="false">浅色</button>
            <button id="debug-toggle" class="icon-button" aria-label="打开调试抽屉" aria-expanded="false">调试</button>
            <button id="export-session" class="icon-button" disabled>导出</button>
            <button id="cancel-run" class="icon-button danger" disabled>停止</button>
          </div>
        </header>

        <section class="conversation">
          <div id="messages" class="messages">
            <div class="welcome">
              <div class="welcome-mark">N</div>
              <h2>把工作交给 Nexus</h2>
              <p>选择一个工作区任务，或从下面的建议开始。</p>
              <div class="starters">
                <button type="button" data-prompt="分析这个项目的结构，并告诉我应该从哪里开始。"><strong>理解项目</strong><span>梳理架构与关键模块</span></button>
                <button type="button" data-prompt="检查当前项目，找出最值得修复的问题。"><strong>检查问题</strong><span>定位错误与风险</span></button>
                <button type="button" data-prompt="根据当前项目目标，实现下一个优先级最高的功能。"><strong>继续开发</strong><span>推进下一个功能切片</span></button>
              </div>
            </div>
          </div>

          <form id="message-form" class="composer">
            <textarea id="message-input" rows="2" placeholder="描述你希望 Nexus 完成的任务…" disabled></textarea>
            <div class="composer-foot">
              <div class="composer-context">
                <span id="composer-provider">本地模型</span>
                <span>逐次审批</span>
              </div>
              <div class="composer-actions">
                <span class="shortcut">Enter 发送</span>
                <button type="submit" class="send-button" aria-label="发送消息" disabled>↑</button>
              </div>
            </div>
          </form>
        </section>
      </main>
    </div>

    <div id="drawer-backdrop" class="drawer-backdrop hidden"></div>
    <aside id="inspector" class="inspector" aria-hidden="true">
      <header class="inspector-head">
        <div>
          <span>任务详情</span>
          <strong>本地工作区</strong>
        </div>
        <button id="debug-close" class="close-button" aria-label="关闭任务详情">×</button>
      </header>
      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="events" role="tab">调试</button>
        <button class="tab" data-tab="memory" role="tab">记忆</button>
      </div>
      <div id="events-view" class="tab-view">
        <div class="debug-note">原始运行事件仅用于诊断，不影响任务执行。</div>
        <div id="events" class="events"></div>
      </div>
      <div id="memory-view" class="tab-view hidden">
        <section class="candidate-section">
          <div class="memory-section-heading">
            <strong>待确认</strong>
            <span>对话结束后提取，不会自动生效</span>
          </div>
          <div id="candidate-list" class="memory-list"></div>
        </section>
        <div class="memory-divider"></div>
        <form id="memory-form" class="memory-form">
          <input id="memory-input" placeholder="记录一条长期记忆">
          <button type="submit">保存</button>
        </form>
        <div id="memory-list" class="memory-list"></div>
      </div>
    </aside>

    <div id="toast" class="toast hidden" role="status"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
